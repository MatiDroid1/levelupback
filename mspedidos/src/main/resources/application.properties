
spring.application.name=mspedidos
server.port=8081

spring.datasource.url=jdbc:h2:mem:pedidos360_pedidos
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

spring.h2.console.enabled=true
spring.h2.console.path=/h2

# Tenant de Azure AD (Entra ID) - Pedidos360
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://login.microsoftonline.com/bb5324af-c266-41ed-b36c-a971641c7af2/v2.0

# IMPORTANTE: Azure AD v2.0 a veces emite el claim "aud" como el appId
# plano (260c8d4a-...) y otras veces con el prefijo completo del
# identifierUri (api://260c8d4a-...), dependiendo de como se solicito
# el scope. Se listan ambas variantes separadas por coma para que
# Spring Security acepte el token sin importar cual formato llegue.
spring.security.oauth2.resourceserver.jwt.audiences=260c8d4a-9eae-4da8-9e2b-76c587b25b85,api://260c8d4a-9eae-4da8-9e2b-76c587b25b85

# RabbitMQ
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=admin
spring.rabbitmq.password=admin123
spring.rabbitmq.listener.simple.acknowledge-mode=manual

# Exchanges
app.rabbit.exchange.topic=pedidos.topic
app.rabbit.exchange.direct=pedidos.direct
app.rabbit.exchange.dlx=pedidos.dlx

# Notificaciones (topic)
app.rabbit.notificaciones.queue=notificaciones.q
app.rabbit.notificaciones.dlq=notificaciones.dlq
app.rabbit.notificaciones.routing-key=pedido.creado
app.rabbit.notificaciones.dlq-routing-key=notificaciones.dead

# Tickets (direct)
app.rabbit.tickets.queue=tickets.q
app.rabbit.tickets.dlq=tickets.dlq
app.rabbit.tickets.routing-key=ticket
app.rabbit.tickets.dlq-routing-key=tickets.dead

# Documentos (direct)
app.rabbit.documentos.queue=documentos.q
app.rabbit.documentos.dlq=documentos.dlq
app.rabbit.documentos.routing-key=documento
app.rabbit.documentos.dlq-routing-key=documentos.dead
# Stock (topic)
app.rabbit.stock.routing-key=pedido.stock