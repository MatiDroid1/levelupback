x-zk: &zk
  image: confluentinc/cp-zookeeper:7.9.0
  restart: unless-stopped
  environment: &zk-env
    ZOOKEEPER_CLIENT_PORT: 2181
    ZOOKEEPER_TICK_TIME: 2000
    ZOOKEEPER_INIT_LIMIT: 5
    ZOOKEEPER_SYNC_LIMIT: 2
    ZOOKEEPER_SERVERS: zk1:2888:3888;zk2:2888:3888;zk3:2888:3888
    KAFKA_HEAP_OPTS: "-Xms256M -Xmx256M"

x-kafka: &kafka
  image: confluentinc/cp-kafka:7.9.0
  restart: unless-stopped
  depends_on: [zk1, zk2, zk3]

x-kafka-env: &kafka-env
  KAFKA_ZOOKEEPER_CONNECT: zk1:2181,zk2:2181,zk3:2181
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
  KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
  KAFKA_DEFAULT_REPLICATION_FACTOR: 3
  KAFKA_MIN_INSYNC_REPLICAS: 2
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
  KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
  KAFKA_HEAP_OPTS: "-Xms512M -Xmx512M"

services:
  zk1:
    <<: *zk
    container_name: zk1
    environment: { <<: *zk-env, ZOOKEEPER_SERVER_ID: 1 }
  zk2:
    <<: *zk
    container_name: zk2
    environment: { <<: *zk-env, ZOOKEEPER_SERVER_ID: 2 }
  zk3:
    <<: *zk
    container_name: zk3
    environment: { <<: *zk-env, ZOOKEEPER_SERVER_ID: 3 }

  kafka1:
    <<: *kafka
    container_name: kafka1
    ports: ["9092:9092"]
    environment:
      <<: *kafka-env
      KAFKA_BROKER_ID: 1
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka1:29092,EXTERNAL://localhost:9092
  kafka2:
    <<: *kafka
    container_name: kafka2
    ports: ["9093:9093"]
    environment:
      <<: *kafka-env
      KAFKA_BROKER_ID: 2
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka2:29092,EXTERNAL://localhost:9093
  kafka3:
    <<: *kafka
    container_name: kafka3
    ports: ["9094:9094"]
    environment:
      <<: *kafka-env
      KAFKA_BROKER_ID: 3
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka3:29092,EXTERNAL://localhost:9094

networks:
  default:
    name: kafka-net
