spring.application.name=mskafkaadmin

# Puerto del administrador Kafka.
server.port=8083

# Acceso Kafka desde el host donde corre el Compose actual.
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092,localhost:9093,localhost:9094}

# Tenant de Microsoft Entra ID del proyecto.
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://login.microsoftonline.com/bb5324af-c266-41ed-b36c-a971641c7af2/v2.0

# Audiencias utilizadas por la API del proyecto.
spring.security.oauth2.resourceserver.jwt.audiences=260c8d4a-9eae-4da8-9e2b-76c587b25b85,api://260c8d4a-9eae-4da8-9e2b-76c587b25b85

# Escrituras permitidas únicamente sobre tópicos de demostración.
app.kafka.writable-prefix=demo.

# No exponer detalles internos mediante el controlador de errores de Boot.
server.error.include-message=never